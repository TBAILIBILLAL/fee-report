name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['8', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Compile
        run: |
          mkdir -p out-test
          javac -source 8 -target 8 -Xlint:-options -encoding UTF-8 -cp "lib/*" -d out-test src/feereport/*.java test/feereport/*.java

      - name: Run database layer checks
        run: java -cp "out-test:lib/*" feereport.DataLayerTest
